name: Scrape props and store to Supabase

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to run (leave blank to auto-detect)"
        required: false
        type: string
      week:
        description: "Week number to run (leave blank to auto-detect)"
        required: false
        type: string
  schedule:
    # Monday 12:00 PM CT (17:00 UTC during CDT) — catches the week's opening
    # line. GitHub Actions cron is fixed UTC, so this drifts to 11:00 AM CT
    # once CDT ends for the season (early November) unless adjusted then.
    - cron: "0 17 * * 1"
    # Thursday 16:00 UTC — before that night's kickoff, catches Thursday
    # Night Football's own closing line.
    - cron: "0 16 * * 4"
    # Sunday 9:00 AM CT (14:00 UTC during CDT) — before the early kickoff
    # window, catches the closing line for the rest of the week's games.
    # GitHub Actions cron is fixed UTC, so this drifts to 8:00 AM CT once
    # CDT ends for the season (early November) unless adjusted then.
    - cron: "0 14 * * 0"

concurrency:
  group: scrape-and-store
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Secrets cannot be referenced directly in a step's `if:` — GitHub
      # rejects the whole workflow file as invalid if you try (confirmed the
      # hard way: every run since this was written failed instantly with
      # zero jobs, including the legitimate scheduled cron runs, not just
      # the alerts step). Job-level env is GitHub's own documented
      # workaround: the secret lands in `env.*` here, which `if:` can read.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Resolve season/week to run
        id: week
        run: |
          if [ -n "${{ github.event.inputs.season }}" ] && [ -n "${{ github.event.inputs.week }}" ]; then
            echo "season=${{ github.event.inputs.season }}" >> "$GITHUB_OUTPUT"
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          OUTPUT=$(npx tsx scripts/current-week.ts)
          CODE=$?
          set -e

          if [ $CODE -eq 0 ]; then
            echo "$OUTPUT" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ $CODE -eq 3 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No current NFL week — nothing to scrape today."
          else
            exit $CODE
          fi

      - name: Run pipeline (nflverse + real odds) and write to Supabase
        if: steps.week.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_BOOKMAKERS: ${{ vars.ODDS_API_BOOKMAKERS }}
          ODDS_API_REGIONS: ${{ vars.ODDS_API_REGIONS }}
          BANKROLL: ${{ vars.BANKROLL }}
          NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
        run: |
          npx tsx scripts/pipeline.ts \
            --season ${{ steps.week.outputs.season }} \
            --week ${{ steps.week.outputs.week }} \
            --store supabase \
            --provider odds-api

      - name: Send email alerts for moved lines
        # Skipped cleanly (not failed) until RESEND_API_KEY is actually
        # configured — this step is opt-in, and the weekly pipeline run
        # above it must keep succeeding for repos that haven't set up email
        # alerts yet. Once the secret exists, scripts/send-alerts.ts's own
        # checks take over and fail loudly on any of the other three
        # missing, per its doc comment.
        if: steps.week.outputs.should_run == 'true' && env.RESEND_API_KEY != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERTS_FROM_EMAIL: ${{ vars.ALERTS_FROM_EMAIL }}
          ALERTS_UNSUBSCRIBE_SECRET: ${{ secrets.ALERTS_UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          npx tsx scripts/send-alerts.ts \
            --season ${{ steps.week.outputs.season }} \
            --week ${{ steps.week.outputs.week }} \
            --store supabase
